llm:
  provider: "openai" # Options: openai, groq, openrouter
  model_name: "gpt-4o-mini" # Examples: groq: "llama3-8b-8192", openrouter: "google/gemini-flash-1.5"
  temperature: 0.0

embedding:
  provider: "openai" # Options: openai, huggingface
  model_name: "text-embedding-3-small" # Example HF: "BAAI/bge-small-en-v1.5"
  dimension: 1536 # Remember to change this if using HF (e.g. 384 for bge-small)

retriever:
  top_k: 5
  collection_name: "medical_dialogue_v1"

qdrant_url: "http://localhost:6333"
# Set QDRANT_API_KEY environment variable if needed
