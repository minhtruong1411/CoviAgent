# Config: Groq (Free tier — extremely fast inference)
# Usage: python scripts/run_benchmark.py --config configs/groq_llama3.yaml

llm:
  provider: "groq"
  model_name: "llama-3.3-70b-versatile"
  temperature: 0.0

embedding:
  provider: "openai"
  model_name: "text-embedding-3-small"
  dimension: 1536

retriever:
  top_k: 5
  collection_name: "medical_dialogue_v1"

qdrant_url: "http://localhost:6333"
