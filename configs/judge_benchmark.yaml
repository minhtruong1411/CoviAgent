# ──────────────────────────────────────────────────────────
# LLM-as-a-Judge Benchmark Configuration
# ──────────────────────────────────────────────────────────
# Usage:
#   python scripts/run_judge_benchmark.py --config configs/judge_benchmark.yaml
#   python scripts/run_judge_benchmark.py --config configs/judge_benchmark.yaml --mode pairwise --config-b configs/openrouter_hf.yaml
#   python scripts/run_judge_benchmark.py --config configs/judge_benchmark.yaml --mode gold-validate

# Pipeline under evaluation
llm:
  provider: "groq"
  model_name: "llama-3.3-70b-versatile"
  temperature: 0.0
  api_key_env_var: "GROQ_API_KEY_2"

embedding:
  provider: "huggingface"
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384

retriever:
  top_k: 5   # ① Số liệu chính: cân với GraphRAG (~2 vector + 3 evidence ≈ 5 đoạn prose)
  collection_name: "medical_dialogue_v1"

qdrant_url: "http://localhost:6333"

# Judge configuration — PHẢI GIỐNG HỆT ở cả 3 config (vector/kg/graphrag) để
# cùng một giám khảo chấm công bằng cho mọi pipeline.
judge:
  provider: "groq"
  # GIÁM KHẢO dùng Groq gpt-oss-120b (khác generator Llama → không self-bias).
  # num_runs=1 để VỪA trần token/ngày của Groq: num_runs=3 tạo ~225k token > 200k TPD.
  model_name: "openai/gpt-oss-120b"
  temperature: 0.0
  api_key_env_var: "GROQ_API_KEY"
  num_runs: 1              # 1 lần chấm — đánh đổi độ ổn định lấy việc vừa quota free
  api_delay_seconds: 8.0
  pass_threshold: 3.0      # Trung bình >= 3.0 → Pass
