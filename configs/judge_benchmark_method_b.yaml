# ──────────────────────────────────────────────────────────
# LLM-as-a-Judge Benchmark Configuration (Method B)
# ──────────────────────────────────────────────────────────
# Dùng cùng mô hình LLM nhưng cấu hình truy xuất (retriever) khác
# để so sánh phương pháp truy xuất.
# Ví dụ ở đây ta đổi top_k từ 5 lên 10.

# Pipeline under evaluation (CÙNG MODEL)
llm:
  provider: "groq"
  model_name: "llama-3.3-70b-versatile"
  temperature: 0.0

embedding:
  provider: "huggingface"
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384

retriever:
  top_k: 8 # ② Robustness: cho Vector RAG DƯ ngữ cảnh để chặn phản biện "thắng vì đọc nhiều chữ hơn"
  collection_name: "medical_dialogue_v1"

qdrant_url: "http://localhost:6333"

# Judge configuration (không cần thiết trong config-b vì sẽ dùng config của A, nhưng có thể khai báo cho đủ format)
judge:
  provider: "groq"
  # GIÁM KHẢO dùng model KHÁC generator (generator = Llama-3.3-70B) để tránh
  # self-preference bias. Xác nhận ID khả dụng trên tài khoản Groq của bạn; có thể
  # thay bằng: moonshotai/kimi-k2-instruct | deepseek-r1-distill-llama-70b ...
  model_name: "openai/gpt-oss-120b"
  temperature: 0.0
  api_key_env_var: "GROQ_API_KEY"
  num_runs: 3              # Majority vote: 3 lần chấm
  api_delay_seconds: 10.0  # Delay tránh rate limit Groq
  pass_threshold: 3.0      # Trung bình >= 3.0 → Pass
