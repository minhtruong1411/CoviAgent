# Config: OpenRouter + HuggingFace
llm:
  provider: "openrouter"
  model_name: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
  temperature: 0.0
  max_tokens: 2048

embedding:
  provider: "huggingface"
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384

retriever:
  top_k: 5
  collection_name: "medical_dialogue_hf"

qdrant_url: "http://localhost:6333"
